[package]
name = "worshipviewer-desktop"
version = "0.1.0"
description = "Worship Viewer desktop application"
authors = ["Worship Viewer contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/xilefmusics/worshipviewer"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
cookie = "0.18"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

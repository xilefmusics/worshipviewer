name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 12.6.0
          runtime: node@26
          working-directory: frontend
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/crates/chordlib-wasm
          shared-key: wv-frontend-wasm

      - name: Install wasm-pack
        run: curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | VERSION=0.15.0 sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Flow coverage lint
        run: pnpm --filter app lint:flows

      - name: Typecheck
        run: pnpm typecheck

      - name: OpenAPI schema drift check
        run: |
          pnpm --filter app openapi:sync
          git diff --exit-code app/src/api/schema.d.ts

      - name: Lint
        run: pnpm lint

      - name: Build
        # postinstall already built WASM during dependency installation.
        run: pnpm --filter app build

      - name: pnpm audit
        run: pnpm audit --audit-level=high

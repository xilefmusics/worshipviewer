name: Desktop release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  publish-desktop:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 12.6.0
          runtime: node@26
          working-directory: frontend
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/app/src-tauri -> target
          shared-key: wv-desktop-${{ matrix.platform }}-${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libdbus-1-dev libssl-dev librsvg2-dev patchelf xdg-utils

      - name: Install wasm-pack
        shell: bash
        run: curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | VERSION=0.15.0 sh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version from release tag
        shell: bash
        run: |
          node scripts/set-desktop-release-version.mjs "$GITHUB_REF_NAME"
          echo "VITE_APP_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Import Apple Developer certificate
        id: apple-signing
        if: matrix.platform == 'macos-latest'
        working-directory: .
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing is not configured; building an unsigned app."
            exit 0
          fi
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Apple notarization requires APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID." >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*\"\(Developer ID Application:.*\)\".*/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity was found in APPLE_CERTIFICATE." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest'
        working-directory: .
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output 'Windows signing is not configured; building an unsigned app.'
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP 'worshipviewer-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          if (-not $certificate.HasPrivateKey) { throw 'Signing certificate has no private key.' }
          $configPath = 'frontend/app/src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $certificate.Thumbprint -Force
          $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256' -Force
          $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue 'http://timestamp.digicert.com' -Force
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath

      - uses: tauri-apps/tauri-action@v1
        if: matrix.platform != 'macos-latest' || steps.apple-signing.outputs.configured != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ github.ref_name }}
        with:
          projectPath: frontend/app
          tagName: ${{ github.ref_name }}
          releaseName: Worship Viewer ${{ github.ref_name }}
          releaseBody: Installers for macOS, Windows, and Linux. See the desktop installation guide for setup details.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - uses: tauri-apps/tauri-action@v1
        if: matrix.platform == 'macos-latest' && steps.apple-signing.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_APP_VERSION: ${{ github.ref_name }}
        with:
          projectPath: frontend/app
          tagName: ${{ github.ref_name }}
          releaseName: Worship Viewer ${{ github.ref_name }}
          releaseBody: Installers for macOS, Windows, and Linux. See the desktop installation guide for setup details.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

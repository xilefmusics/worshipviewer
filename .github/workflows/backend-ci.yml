name: Backend CI

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
    paths:
      - "backend/**"
      - "cli/**"
      - "shared/**"
      - "frontend/**"
      - "docs/openapi.json"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-ci.yml"
      - ".spectral.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "cli/**"
      - "shared/**"
      - "frontend/crates/chordlib-wasm/**"
      - "docs/openapi.json"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-ci.yml"
      - ".spectral.yaml"

jobs:
  backend-validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      # Baked into `backend` via `option_env!("GIT_COMMIT_SHA")` for `GET /api/v1/about`.
      GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Format check
        run: |
          cargo fmt --manifest-path backend/Cargo.toml --check
          cargo fmt --manifest-path shared/Cargo.toml --check
          cargo fmt --manifest-path cli/Cargo.toml --check

      - name: OpenAPI tri-copy byte equality
        run: |
          cmp docs/openapi.json backend/openapi.json
          cmp docs/openapi.json frontend/app/src/api/openapi.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: wv-backend

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (backend, cli, shared, chordlib-wasm)
        run: |
          (cd backend && cargo audit)
          (cd cli && cargo audit)
          (cd shared && cargo audit)
          (cd frontend/crates/chordlib-wasm && cargo audit)

      - name: Test
        working-directory: backend
        run: cargo test -- --test-threads=4

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: OpenAPI Spectral (committed backend/openapi.json)
        run: npx --yes @stoplight/spectral-cli@6 lint backend/openapi.json -r .spectral.yaml

      - name: Clippy
        working-directory: backend
        run: cargo clippy -- -D warnings

  docker-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/xilefmusics/worshipviewer
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=worshipviewer-amd64
          cache-to: type=gha,mode=max,scope=worshipviewer-amd64

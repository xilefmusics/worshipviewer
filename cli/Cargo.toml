[package]
name = "worshipviewer-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "worshipviewer"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
dirs = "6.0.0"
shared = { path = "../shared", features = ["cli"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

